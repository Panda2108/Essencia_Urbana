<section class="page-section vendor-panel">
 <div class="section-heading"><div><span class="eyebrow">TU NEGOCIO, AL DÍA</span><h1>{{data?.stall.name || 'Mi negocio'}}</h1><p class="muted">{{data?.stall.seller}} · Precios, existencias y pedidos de tu puesto.</p></div><button class="btn" @click="reload" :disabled="busy||loading">Actualizar ↻</button></div>
 <div v-if="error" class="notice error" role="alert">{{error}}</div><div v-if="message" class="notice success" role="status">{{message}}</div>
 <p v-if="loading" class="muted" role="status">Cargando tu negocio…</p>
 <template v-if="data">
 <div class="vendor-stats"><article><small>Ventas registradas</small><strong>{{money(data.stats.sales)}}</strong></article><article><small>Pedidos por pagar</small><strong>{{data.stats.pending_orders}}</strong></article><article><small>Productos agotados</small><strong>{{data.stats.out_of_stock}}</strong></article><article><small>Productos con stock bajo</small><strong>{{data.stats.low_stock}}</strong></article></div>
 <div class="vendor-toolbar"><div class="categories"><button :class="{selected:tab==='inventory'}" @click="tab='inventory'">Mis productos</button><button :class="{selected:tab==='add'}" @click="tab='add'">Agregar producto</button><button :class="{selected:tab==='orders'}" @click="tab='orders'">Pedidos del negocio</button><button :class="{selected:tab==='history'}" @click="tab='history'">Historial de pedidos</button><button :class="{selected:tab==='activity'}" @click="tab='activity'">Movimientos</button></div><small class="muted">Actualizado {{lastUpdate}}</small></div>
 <template v-if="tab==='inventory'">
 <div class="vendor-toolbar"><label>Buscar producto<input type="search" v-model="search" placeholder="Nombre del producto"></label><label>Disponibilidad<select v-model="filter"><option value="all">Todos</option><option value="out">Agotados</option><option value="low">Stock bajo (1–5)</option></select></label></div>
 <p class="muted small-text">El stock disponible excluye las unidades reservadas en pedidos. Cada ajuste queda registrado con su motivo.</p>
 <div v-if="!products.length" class="empty">No hay productos con esos filtros.</div>
 <article v-for="p in products" :key="p.id" class="vendor-product">
  <div class="vendor-product-title"><img :src="p.image" :alt="p.name" width="65" height="65"><div><small class="product-category">{{p.category}}</small><h3>{{p.name}}</h3><span class="vendor-stock" :class="{danger:p.stock===0}">{{p.stock}} disponibles</span></div></div>
  <form class="vendor-price" @submit.prevent="price(p)"><label>Precio (S/)<input type="number" v-model="p.newPrice" min="0.01" max="100000" step="0.01" required :disabled="busy"></label><button class="btn" :disabled="busy||Number(p.newPrice)===Number(p.price)">Guardar precio</button></form>
  <div class="vendor-stock-controls"><label>Unidades<input type="number" v-model="p.units" min="1" max="100000" step="1" :disabled="busy"></label><label>Motivo<input v-model="p.reason" maxlength="300" placeholder="Reposición, merma, inventario…" :disabled="busy"></label><div><button class="btn primary" @click="adjust(p,1)" :disabled="busy">＋ Reponer</button><button class="btn" @click="adjust(p,-1)" :disabled="busy||p.stock===0">− Retirar</button></div></div>
 </article>
 </template>
 <template v-else-if="tab==='add'">
 <form class="panel product-create-form" @submit.prevent="createProduct">
 <div><span class="eyebrow">UN NUEVO PRODUCTO EN TU NEGOCIO</span><h2>Agregar producto</h2><p class="muted">Publica una foto, el nombre, tu precio y las unidades disponibles.</p></div>
 <div class="product-photo-field"><label for="product-photo">Foto del producto</label><div class="product-photo-preview"><img v-if="photoPreview" :src="photoPreview" alt="Vista de la foto del nuevo producto"><span v-else>Selecciona una foto para verla aquí</span></div><input id="product-photo" ref="photoInput" type="file" accept="image/jpeg,image/png,image/webp" @change="selectPhoto" :disabled="busy"><small class="muted">JPG, PNG o WebP · Hasta 5 MB</small></div>
 <div class="product-create-fields"><label>Nombre del producto<input v-model="draft.name" required minlength="3" maxlength="180" placeholder="Ej.: Aceite vegetal 1 litro" :disabled="busy"></label><label>Categoría<select v-model="draft.category" required :disabled="busy"><option disabled value="">Selecciona una categoría</option><option v-for="category in categories" :value="category">{{category}}</option></select></label><div class="product-create-numbers"><label>Precio (S/)<input v-model="draft.price" type="number" required min="0.01" max="100000" step="0.01" :disabled="busy"></label><label>Stock inicial<input v-model="draft.stock" type="number" required min="0" max="100000" step="1" :disabled="busy"></label></div><button class="btn primary" :disabled="busy">{{busy?'Publicando producto…':'Publicar producto'}}</button></div>
 </form>
 </template>
 <template v-else-if="tab==='orders'||tab==='history'">
 <label v-if="tab==='orders'" class="vendor-order-filter">Mostrar<select v-model="orderFilter"><option value="all">Todos los pedidos</option><option value="pending">Por pagar</option><option value="completed">Pago confirmado</option><option value="cancelled">Cancelados</option></select></label>
 <label v-else class="vendor-order-filter">Historial<select v-model="historyFilter" :disabled="historyLoading"><option value="all">Entregados y cancelados</option><option value="delivered">Entregados</option><option value="cancelled">Cancelados</option></select></label>
 <p v-if="tab==='history'&&historyLoading" role="status" class="muted">Cargando historial…</p>
 <div v-if="!(tab==='history'?history:orders).length" class="empty"><h3>Aún no hay pedidos para mostrar</h3><p>Los pedidos que incluyan tus productos aparecerán aquí.</p></div>
 <article v-for="o in (tab==='history'?history:orders)" :key="o.id" class="order-card"><div class="order-head"><div><b>Pedido #{{o.id.slice(0,8)}}</b><small>{{date(o.created_at)}}</small></div><span class="status" :class="o.status">{{o.status==='pending'?'Por pagar':o.status==='cancelled'?'Cancelado':'Pago confirmado'}}</span></div>
 <div v-for="i in o.items" class="order-line"><img :src="i.image" :alt="i.name" width="50" height="50"><div class="line-info"><b>{{i.name}}</b><small>{{i.quantity}} × {{money(i.price)}}</small></div><strong>{{money(i.quantity*i.price)}}</strong></div>
 <div class="order-bottom"><p><b>{{o.customer||'Cliente'}}</b><small v-if="o.phone">Teléfono: {{o.phone}}</small><small>{{o.delivery==='delivery'?'Entrega: '+o.address:'Retiro en el mercado'}}</small></p><strong>Tu venta: {{money(o.total)}}</strong></div>
 <div v-if="o.status==='completed'" class="vendor-progress"><span>Preparación: <b>{{stages[o.stage]}}</b></span><ol class="order-phase-steps"><li v-for="(label,key) in stages" :class="{done:stageDone(o.stage,key),current:o.stage===key}"><span aria-hidden="true">{{stageDone(o.stage,key)?'✓':'○'}}</span>{{label}}</li></ol><button v-if="tab==='orders'&&nextStage(o)" class="btn primary" :disabled="busy" @click="setStage(o,nextStage(o))">{{nextStage(o)==='preparando'?'Iniciar preparación':nextStage(o)==='listo'?'Marcar listo para entregar':'Confirmar entrega'}}</button></div>
 <p v-else-if="o.status==='pending'" class="muted small-text">Las unidades ya están reservadas. Espera el pago para iniciar la preparación.</p>
 </article>
 <button v-if="tab==='history'&&historyMore" class="btn" @click="loadHistory(true)" :disabled="historyLoading">Cargar más pedidos</button>
 </template>
 <template v-else><div v-if="!data.events.length" class="empty">Tus reposiciones, retiros y cambios de precio aparecerán aquí.</div><article v-for="e in data.events" :key="e.id" class="vendor-event"><div><b>{{e.product}}</b><p>{{e.reason}}</p><small>{{date(e.created_at)}}</small></div><strong v-if="e.kind==='price'">{{money(e.price_before)}} → {{money(e.price_after)}}</strong><strong v-else>{{e.quantity>0?'+':''}}{{e.quantity}} uds.<small>{{e.before}} → {{e.after}} disponibles</small></strong></article></template>
 </template>
</section>
